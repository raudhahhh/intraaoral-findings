<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oral Hygiene</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="container">
  <h2>Oral Hygiene</h2>

  <form id="oralStatusForm">
    <label class="card">
      <input type="radio" name="oralStatus" value="Good" required />
      Good
    </label>

    <label class="card">
      <input type="radio" name="oralStatus" value="Moderate" />
      Moderate
    </label>

    <label class="card">
      <input type="radio" name="oralStatus" value="Poor" />
      Poor
    </label>

    <!-- BUTTON ROW -->
    <div class="button-row">
      <a href="index.html" class="btn secondary">← Back</a>
      <button type="submit" class="btn secondary">Next</button>
    </div>
  </form>
</main>

<script src="js/oral-status.js"></script>
</body>
</html>
