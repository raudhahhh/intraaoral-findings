<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oral Hygiene</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="container">
  <h2>Oral Hygiene (Based on O'Leary Plaque Score)</h2>

  <form id="oralStatusForm">
    <label class="card">
      <input type="radio" name="oralStatus" value="Good" required />
      Good Hygiene - 21-40%
    </label>

    <label class="card">
      <input type="radio" name="oralStatus" value="Moderate" />
      Moderate Hygiene - 41-60%
    </label>

    <label class="card">
      <input type="radio" name="oralStatus" value="Poor" />
      Poor Hygiene - 61-100%
    </label>

    <div class="nav-buttons">
      <a href="index.html" class="btn secondary">← Back</a>
      <button type="submit" class="btn primary">Next</button>
    </div>
  </form>
  
 <hr class="reference-divider">

  <p class="reference-text">
    Ferrari M, Denise IK, Edoardo F, Fabio C.
    <em>Restorative difficulty evaluation system of endodontically treated teeth.</em>
    J Esthet Restor Dent. 2022;34:65–80.
  </p>  
</main>

<script src="js/oral-status.js"></script>
</body>
</html>
